name: Block Cloudflare Worker Name PRs
# Cloudflare creates PRs to update worker names before another workflow does it automatically, this deletes those PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  block-name-change:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v3

      - name: Check PR author
        id: author_check
        run: |
          echo "PR author: ${{ github.actor }}"
          if [ "${{ github.actor }}" == "cloudflare[bot]" ]; then
            echo "is_cf=true" >> $GITHUB_ENV
          else
            echo "is_cf=false" >> $GITHUB_ENV
          fi

      - name: Check worker name change
        id: check_name
        run: |
          git fetch origin ${{ github.base_ref }}
          diff=$(git diff origin/${{ github.base_ref }} HEAD -- wrangler.toml || true)

          if echo "$diff" | grep -q '^[-+]name\s*='; then
            echo "Worker name changed"
            echo "name_changed=true" >> $GITHUB_ENV
          else
            echo "name_changed=false" >> $GITHUB_ENV
          fi

      - name: Close PR
        if: env.name_changed == 'true' && env.is_cf == 'true'
        uses: peter-evans/close-pull@v3
        with:
          comment: Closing Cloudflare's automatic PR for worker name change.
          delete-branch: true
