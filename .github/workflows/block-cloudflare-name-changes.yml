name: Block Cloudflare Worker Name PRs
# Cloudflare creates PRs to update worker names before another workflow does it automatically, this deletes those PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  block-name-change:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title
        id: check_title
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          echo "PR title: $PR_TITLE"
          TARGET_TITLE="Update name in Wrangler configuration file to match deployed Worker"
          if [ "$PR_TITLE" == "$TARGET_TITLE" ]; then
            echo "block=true" >> $GITHUB_ENV
          else
            echo "block=false" >> $GITHUB_ENV
          fi

      - name: Close PR
        if: env.block == 'true'
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          gh pr close --comment "Closing Cloudflare's automatic PR for worker name change" --delete-branch ${{ github.event.pull_request.number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
