name: Deploy Cloudflare Worker with Correct Name

on:
  push:
    branches:
      - main
      - dev

jobs:
  deploy-worker:
    if: github.event.head_commit.message != 'Auto-set worker name in wrangler.jsonc after merge'

    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Correct worker name
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/dev" ]]; then
            WORKER_NAME="test-discord-app-dev"
          elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            WORKER_NAME="test-discord-app"
          fi

          sed -i "s/\"name\": \".*\"/\"name\": \"$WORKER_NAME\"/" wrangler.jsonc

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Only commit if there was an actual change
          if git diff --quiet; then
            echo "No changes to commit."
          else
            git add wrangler.jsonc
            git commit -m "Auto-set worker name in wrangler.jsonc after merge"
            git push
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install Dependencies
        run: npm ci -g

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/dev" ]]; then
            wrangler deploy --env dev
          elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            wrangler deploy
          fi
