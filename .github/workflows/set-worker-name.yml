name: Correct worker name on dev/prod

on:
  push:
    branches:
      - main
      - dev

jobs:
  set-name:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Correct worker name
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/dev" ]]; then
            WORKER_NAME="test-discord-app-dev"
          elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            WORKER_NAME="test-discord-app"
          fi

          sed -i "s/^\s*\"name\": \".*\"/\"name\": \"|__WORKER_NAME__|\"/" wrangler.jsonc

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Only commit if there was an actual change
          if git diff --quiet; then
            echo "No changes to commit."
          else
            git add wrangler.jsonc
            git commit -m "Auto-set worker name in wrangler.jsonc after merge"
            git push
          fi
